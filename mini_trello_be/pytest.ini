[pytest]
DJANGO_SETTINGS_MODULE = mini_trello_be.settings
python_files = test_*.py
testpaths = boards/tests
addopts = -q --strict-markers
filterwarnings =
    # Third-party deprecations we do not control: graphene 2 / graphql-core 2,
    # Django 3.2 on Python 3.12, and botocore's use of datetime.utcnow().
    ignore::DeprecationWarning:graphene.*
    ignore::DeprecationWarning:graphql.*
    ignore::DeprecationWarning:django.*
    ignore::DeprecationWarning:botocore.*
