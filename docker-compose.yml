# Local development stack: React (nginx) -> Django GraphQL -> DynamoDB Local.
#
# Ports are overridable so the stack can run alongside other projects:
#   FRONTEND_PORT=4000 BACKEND_PORT=4001 docker compose up

services:
  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    # -sharedDb keeps one database regardless of credentials, and -dbPath makes
    # it survive a restart. Without these, cards vanished when the container
    # was recycled.
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
    working_dir: /home/dynamodblocal
    user: root
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    ports:
      - "${DYNAMODB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./mini_trello_be
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-compose-development-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,backend
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
      AWS_DEFAULT_REGION: us-west-2
      # DynamoDB Local ignores credentials but boto3 requires them to be set.
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    depends_on:
      dynamodb:
        condition: service_healthy

  frontend:
    build:
      context: ./mini_trello_fe
      args:
        # Baked in at build time; CRA cannot read this at runtime.
        REACT_APP_GRAPHQL_URL: http://localhost:${BACKEND_PORT:-8001}/graphql
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      - backend

volumes:
  dynamodb-data:
