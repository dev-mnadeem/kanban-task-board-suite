name: Board checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  graphql:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini_trello_be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mini_trello_be/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q
  board:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini_trello_fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mini_trello_fe/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test -- --watchAll=false --runInBand
      - run: npm run build
